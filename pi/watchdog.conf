# Hardware-Watchdog fuer den Pi (systemd-Drop-in).
# Ziel: Haengt sich der ganze Pi auf (Kernel, WLAN-Treiber, ...), startet er
# sich selbst neu - niemand muss mehr das Netzteil aus- und einstecken.
#
# Installation auf dem Pi (siehe pi/README.md, Abschnitt 3b):
#   sudo mkdir -p /etc/systemd/system.conf.d
#   sudo cp ~/opa-checkin/pi/watchdog.conf /etc/systemd/system.conf.d/watchdog.conf
#   sudo systemctl daemon-reexec

[Manager]
# systemd "streichelt" den Watchdog-Chip des Pi regelmaessig. Bleibt das
# laenger als 15 Sekunden aus (System eingefroren), loest der Chip einen
# harten Neustart aus.
RuntimeWatchdogSec=15
# Dasselbe fuer den Moment des Herunterfahrens/Neustarts: haengt dieser
# laenger als 2 Minuten, wird er erzwungen.
RebootWatchdogSec=2min
